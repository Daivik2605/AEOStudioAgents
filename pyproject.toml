[project]
name = "aeo-studio-agents"
version = "0.1.0"
description = "AEO Studio agent platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "protego>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
aeo = "aeo.cli:app"

[tool.setuptools]
# aeo/ is the command-line entry point; core/, scoring/, diagnose/ and audit/ are the
# code behind it.
packages = ["aeo", "core", "scoring", "diagnose", "audit"]

[tool.setuptools.package-data]
scoring = ["config.yaml"]
core = ["model_prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
