[project]
name = "aeo-studio-agents"
version = "0.1.0"
description = "AEO Studio agent platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# core/ exists now but there's still no CLI entry point to wire up, so this
# stays a dependencies-only install rather than a real installed package.
# Revisit once the `aeo` command is built.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
