# Weights and tier bands for scoring/scoring.py (PLAN.md section 11).
# PLAN.md is the source of truth for what these numbers should be; this file
# just makes them editable without touching code.

# opportunity_score = gap_score * <gap_score weight>
#                    + fixability_signal * <fixability_signal weight>
#                    + business_reality_signal * <business_reality_signal weight>
opportunity_score_weights:
  gap_score: 0.5
  fixability_signal: 0.3
  business_reality_signal: 0.2

# Tiers are defined by their LOWER edge (PLAN.md section 8): a visibility_score
# (0-100, decimals allowed) falls into the first band whose "below" it is
# strictly under. So 19.4 is Invisible, and exactly 20.0 is Barely Visible.
# Bands must be listed low to high. The last band uses .inf ("no upper limit")
# so 80-100 is Dominant; visibility_tier() already rejects scores above 100.
visibility_tiers:
  - { below: 20, label: "Invisible" }
  - { below: 40, label: "Barely Visible" }
  - { below: 60, label: "Partially Visible" }
  - { below: 80, label: "Visible" }
  - { below: .inf, label: "Dominant" }
